name: Captures
# Photographie chaque écran sur un émulateur Android 14, en clair et en
# sombre, avec les données d'EXEMPLE de CapturesActivity (version debug :
# aucun appel au serveur, aucun compte créé). Les images vont sur la branche
# « captures ».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'core/**', '.github/workflows/captures.yml']
permissions:
  contents: write
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Émulateur et captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1080x2400
          script: bash .github/outils/captures.sh
      - name: Publier
        if: always()
        run: |
          ls captures || exit 0
          cd captures && git init -q && git checkout -q -b captures
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Captures ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" captures

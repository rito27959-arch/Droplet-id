name: Compiler
# Compile l'app (debug et release optimisée), lance les tests et publie les APK
# comme artefact de l'exécution. Aucune clé de signature n'est utilisée ici.
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Plateformes Android disponibles
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | grep -E "platforms;android-3[6-9]" | head -20 || true
          # Le plugin Android installe la plateforme qui manque (licences acceptées sur les machines GitHub).
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler et tester
        run: |
          ./gradlew --no-daemon --stacktrace :core:designsystem:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
          ./gradlew --no-daemon :app:bundleRelease
      - name: Tailles
        run: |
          ls -la app/build/outputs/apk/debug/ app/build/outputs/apk/release/ app/build/outputs/bundle/release/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: droplet-id-debug
          path: app/build/outputs/apk/debug/*.apk
      # L'APK de debug sur la branche « telechargements » : un lien direct,
      # téléchargeable depuis le téléphone sans compte GitHub.
      - name: Publier les APK
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/dl
          cp app/build/outputs/apk/debug/*arm64-v8a*.apk /tmp/dl/droplet-id-debug.apk
          cp app/build/outputs/apk/release/*arm64-v8a*.apk /tmp/dl/droplet-id.apk
          cp app/build/outputs/apk/release/*armeabi-v7a*.apk /tmp/dl/droplet-id-anciens-telephones.apk
          cd /tmp/dl && git init -q && git checkout -q -b telechargements
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add *.apk && git commit -qm "APK ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" telechargements
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapports
          path: '**/build/reports/**'
